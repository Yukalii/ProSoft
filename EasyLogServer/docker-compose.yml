version: '3.8'

services:
  easylog-server:
    build: .
    container_name: easylog-server
    ports:
      - "8080:8080"
    volumes:
      - central_logs:/var/logs/easysave
    environment:
      - LOG_DIR=/var/logs/easysave
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  central_logs: