name: GitActionBuild

on:
  push:
    branches: [ "main" , "PreProduction"]
  pull_request:
    branches: [ "main" , "PreProduction"]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        run: dotnet restore ProSoft.sln
      
      - name: Clean the solution
        run: dotnet clean ProSoft.sln
      
      - name: Build the solution
        run: dotnet build ProSoft.sln --no-restore --configuration Release
